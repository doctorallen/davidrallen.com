<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>David Allen · Tactical plot</title>
<meta name="description" content="A tactical plot of David Allen's work: tools, a game engine, games and a career, as contacts on a nav display.">
<meta name="theme-color" content="#04060b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#04060b;min-height:100%}
body{overflow:hidden}
.o.fc.tac .sc,.o.fc.tac .sc{height:100vh;height:100dvh}
.o.fc.tac .sc-foot a{text-decoration:none}
@container site (max-width:640px){.o.fc.tac .sc{height:100vh;height:100dvh}}
/* ===================== Six directions ===================== */
.o{container:site/inline-size;--gold:#dca24a;--steel:#9fbfd4;--tx:#d9e0e4;--mu:#9ba4af;--mono:'IBM Plex Mono',ui-monospace,monospace;--head:'Chakra Petch',sans-serif;
  font-family:Inter,system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;min-height:100%}
.o *{box-sizing:border-box}
.o [hidden]{display:none!important}
.o h1,.o h2,.o h3,.o h4,.o p{margin:0}
.o a{color:inherit;text-decoration:none}
.o a:focus-visible,.o button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.o .sig{display:block;width:100%;height:auto}
.o img{display:block}
.o .px{image-rendering:pixelated}
.o [data-in]{opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s cubic-bezier(.3,.7,.2,1)}
.o [data-in].in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.o [data-in]{opacity:1;transform:none;transition:none}}
/* shared picture boxes */
.o .pic,.o .m-pic,.o .c-pic,.o .b-pic,.o .e-pic,.o .x-mpic{position:relative;overflow:hidden;background:#07080b}
.o .pic img,.o .m-pic img,.o .c-pic img,.o .b-pic img,.o .e-pic img,.o .x-mpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.o .logo img{inset:12% 14%!important;width:72%!important;height:76%!important;object-fit:contain!important}


.o.fc{--gold:#d4922c;--ink:#d4922c;--mut:#9ba4af;--px:'Press Start 2P',monospace}
/* ---------------------------------------------------------------- C. Star chart */
.fc{background:#04060b}
.fc .sc{position:relative;height:700px;overflow:hidden;outline:none}
.fc .sc:focus-visible{box-shadow:inset 0 0 0 2px var(--gold)}
.fc .sc-c{display:block;width:100%;height:100%}
.fc .sc-hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:18px 22px;font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#6f8294;pointer-events:none}
.fc .sc-hud b{display:block;color:#dfe8f0;font-weight:500}
.fc .sc-hud span{display:block;margin-top:5px}
.fc .sc-hud-l .sc-lock{margin-top:6px}
.fc .sc-hud-r{text-align:right}
.fc .sc-lock{color:var(--gold)}
.fc .sc-read{position:absolute;right:22px;top:86px;width:340px;padding:18px 20px 20px;background:#070a12e6;border:1px solid #1d2a3a;font:14px/1.55 Inter,system-ui,sans-serif;color:#c3ccd6;transition:opacity .3s,transform .3s}
.fc .sc-read.off{opacity:0;transform:translateX(12px);pointer-events:none}
.fc .sc-read-k{font:500 10px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.fc .sc-read-h{font:700 24px var(--head);color:#fff;margin-top:8px;line-height:1.1}
.fc .sc-read-s{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-top:6px}
.fc .sc-read-pic{margin:14px 0 12px;height:130px;background:#0a0d14;border:1px solid #1d2a3a;overflow:hidden;position:relative}
.fc .sc-read-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fc .sc-read-pic.logo img{inset:12% 14%;width:72%;height:76%;object-fit:contain}
.fc .sc-read-pic.you img{filter:grayscale(1) contrast(1.05);object-position:center 20%}
.fc .sc-read-pic:empty{display:none}
.fc .sc-read-p{min-height:44px}
.fc .sc-read-a{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.fc .sc-read-a a{display:inline-flex;gap:8px;align-items:center;padding:9px 14px;border:1px solid var(--gold);color:var(--gold);font:600 12px var(--head);letter-spacing:.14em;text-transform:uppercase}
.fc .sc-read-a a:hover{background:var(--gold);color:#000}
.fc .sc-foot{position:absolute;left:22px;right:22px;bottom:16px;display:flex;justify-content:space-between;align-items:center;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#56677a;pointer-events:none}
.fc .sc-foot-r{display:flex;gap:18px}
.fc .sc-foot a{pointer-events:auto;color:#9fb3c6}
.fc .sc-foot a:hover{color:var(--gold)}
.fc .sc-foot svg{display:none}
@container site (max-width:640px){
  .fc .sc{height:640px}
  .fc .sc-hud{padding:14px 14px;font-size:9px}
  .fc .sc-read{left:12px;right:12px;top:auto;bottom:48px;width:auto;padding:14px 16px 16px;font-size:13px}
  .fc .sc-read-h{font-size:20px}
  .fc .sc-read-pic{height:80px;float:right;width:120px;margin:0 0 8px 12px}
  .fc .sc-read-p{min-height:0}
  .fc .sc-foot{left:14px;right:14px;bottom:12px;font-size:9px}
  .fc .sc-foot>span:first-child{display:none}
  .fc .sc-read-pic.you{display:none}
  .fc .sc-read-a a{padding:7px 10px;font-size:11px}
}


/* orrery controls */
.fc .sc-speed{display:inline-flex;gap:6px;margin-left:18px;pointer-events:auto}
.fc .sc-speed button{all:unset;cursor:pointer;padding:5px 9px;border:1px solid #1d2a3a;color:#9fb3c6;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.fc .sc-speed button.on{border-color:var(--gold);color:var(--gold)}
.fc .sc-speed button:hover{color:#fff}
.fc .sc-clock,.fc .sc-range{color:#9fb3c6}
/* deep field: the contact rail and the prev/next in the readout */
.fc .sc-rail{position:absolute;left:22px;top:78px;display:flex;flex-direction:column;gap:2px;max-height:calc(100% - 140px);overflow:auto;scrollbar-width:none;z-index:2}
.fc .sc-rail::-webkit-scrollbar{display:none}
.fc .sc-rail button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:4px 8px 4px 6px;border-left:2px solid transparent;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#56677a}
.fc .sc-rail button b{font-weight:500;color:#7f93a6;min-width:34px}
.fc .sc-rail button:hover{color:#dfe8f0}
.fc .sc-rail button.on{border-left-color:var(--gold);color:var(--gold)}
.fc .sc-rail button.on b{color:var(--gold)}
.fc .sc-nav{display:flex;gap:4px;justify-content:flex-end;pointer-events:auto;margin-bottom:8px}
.fc .sc-nav button{all:unset;cursor:pointer;width:30px;height:28px;border:1px solid #2a3a4e;color:#9fb3c6;text-align:center;font:500 16px/26px var(--mono)}
.fc .sc-nav button:hover{border-color:var(--gold);color:var(--gold)}
.fc .sc-eta{color:var(--gold)}
.fc .sc-rail-x{display:grid;grid-template-columns:auto;gap:0}
.fc .sc-rail-x .sc-rail-h,.fc .sc-rail-x button{display:grid;grid-template-columns:46px 118px 58px 36px;gap:8px;align-items:baseline}
.fc .sc-rail-x .sc-rail-h{padding:0 8px 6px 8px;font:500 8px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#3f5468;border-bottom:1px solid #1d2a3a;margin-bottom:4px}
.fc .sc-rail-x .sc-rail-h span:nth-child(2){grid-column:2/4;text-align:right}
.fc .sc-rail-x button{padding:3px 8px 3px 6px}
.fc .sc-rail-x button span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fc .sc-rail-x button i{font-style:normal;text-align:right;color:#56677a;font-variant-numeric:tabular-nums}
.fc .sc-rail-x button.on i{color:var(--gold)}
/* tactical: after the UNN console and the Razorback map */
.fc.tac{--blue:#9ad0ea;--line:#2f5f80;--dim:#4f7a99;--fill:#9ad0ea22;--ok:#7ed37a;background:#04060b;-webkit-tap-highlight-color:transparent}
.fc.tac .sc,.fc.tac .sc *{-webkit-tap-highlight-color:transparent}
.fc.tac .sc:focus,.fc.tac .sc:focus-visible{box-shadow:none;outline:none}
.fc.tac .sc-c{user-select:none;-webkit-user-select:none;touch-action:manipulation}
.fc.tac .sc{height:720px}
.fc.tac .sc-c{position:absolute;inset:0}
.fc.tac .tx-sec{position:relative;padding-top:12px}
.fc.tac .tx-sec::before{content:"";position:absolute;left:0;right:0;top:8px;height:1px;background:var(--line)}
.fc.tac .tx-sec::after{content:"";position:absolute;left:0;top:7px;width:28px;height:3px;background:var(--blue)}
.fc.tac .tx-sec small{position:absolute;left:0;top:-4px;font:500 7px var(--mono);letter-spacing:.14em;color:var(--dim)}
.fc.tac .tx-sec b{display:block;font:500 13px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.fc.tac .tx-rail{position:absolute;left:0;top:0;bottom:0;width:14px;border-right:1px solid var(--line);background:#070b12}
.fc.tac .tx-rail span{position:absolute;left:-2px;top:50%;transform:rotate(-90deg) translateX(-50%);transform-origin:left top;font:500 9px var(--head);letter-spacing:.3em;text-transform:uppercase;color:var(--blue);white-space:nowrap}
.fc.tac .tx-rail i{position:absolute;left:5px;width:3px;height:36px;background:var(--line)}
.fc.tac .tx-rail .r1{top:120px;background:var(--gold)}.fc.tac .tx-rail .r2{top:164px;background:var(--blue)}
.fc.tac .tx-rail em{position:absolute;left:4px;bottom:120px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.fc.tac .tx-head{position:absolute;left:26px;right:22px;top:20px;display:grid;grid-template-columns:1fr auto auto;gap:24px;align-items:start;pointer-events:none}
.fc.tac .tx-head .tx-sec{max-width:280px}
.fc.tac .tx-head-r{text-align:right;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding-top:14px}
.fc.tac .tx-head-r span{display:block;margin-top:4px}
.fc.tac .sc-lock{color:var(--blue)}
.fc.tac .sc-eta{color:var(--gold)}.fc.tac .sc-eta.ok{color:var(--ok)}
.fc.tac .sc-nav{margin:12px 0 0;gap:6px}
.fc.tac button,.fc.tac a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fc.tac .sc-nav button,.fc.tac .tx-bar button{all:unset;cursor:pointer;min-width:32px;height:28px;padding:0 12px;border:1px solid var(--blue);border-radius:3px;background:var(--fill);color:var(--blue);font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;text-align:center;line-height:28px;box-sizing:border-box;touch-action:manipulation}
.fc.tac .sc-nav button:hover,.fc.tac .tx-bar button:hover{background:var(--blue);color:#04060b}
.fc.tac .sc-nav button:focus-visible,.fc.tac .tx-bar button:focus-visible{outline:1px solid #fff;outline-offset:2px}
.fc.tac .sc-nav .tx-listbtn{display:none}
.fc.tac .tx-list{position:absolute;left:26px;top:92px;width:284px;font:500 10px var(--mono);color:var(--blue)}
.fc.tac .tx-cols{display:grid;grid-template-columns:66px 1fr 54px 34px;gap:6px;padding:10px 0 5px;font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
.fc.tac .tx-cols span:nth-child(n+3){text-align:right}
.fc.tac .tx-rows{position:relative;max-height:330px;overflow:auto;scrollbar-width:none;border-right:1px solid var(--line)}
.fc.tac .tx-rows::-webkit-scrollbar{display:none}
.fc.tac .tx-rows button{all:unset;cursor:pointer;display:grid;grid-template-columns:66px 1fr 54px 34px;gap:6px;align-items:center;width:100%;box-sizing:border-box;padding:4px 6px 4px 0;font:inherit;color:var(--dim);border-bottom:1px solid #12263a}
.fc.tac .tx-rows button:hover{color:#fff}
.fc.tac .tx-rows button.on{background:var(--fill);color:#fff}
.fc.tac .tx-rows button i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--t);margin:0 6px 1px 2px;vertical-align:middle}
.fc.tac .tx-rows button b{white-space:nowrap}
.fc.tac .tx-rows button b{font-weight:500;color:var(--blue)}
.fc.tac .tx-rows button.on b{color:var(--gold)}
.fc.tac .tx-rows button span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;letter-spacing:.04em;text-transform:uppercase}
.fc.tac .tx-rows button em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.fc.tac .tx-bar{position:relative;display:flex;align-items:center;gap:14px;margin-top:14px}
.fc.tac .tx-bar::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line);z-index:0}
.fc.tac .tx-bar button{position:relative;z-index:1;background:#04060b}
.fc.tac .tx-bar button:hover{background:var(--blue)}
.fc.tac .tx-chk{position:relative;z-index:1;margin-left:auto;display:flex;align-items:center;gap:6px;cursor:pointer;background:#04060b;padding-left:8px;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.fc.tac .tx-chk input{position:absolute;opacity:0;width:0;height:0}
.fc.tac .tx-chk i{width:11px;height:11px;border:1px solid var(--blue);box-sizing:border-box}
.fc.tac .tx-chk input:checked+i{background:var(--blue);box-shadow:inset 0 0 0 2px #04060b}
.fc.tac .tx-chk input:focus-visible+i{outline:1px solid #fff;outline-offset:2px}
.fc.tac .sc-read{position:absolute;right:22px;top:92px;width:340px;padding:0;border:0;background:transparent;font:13px/1.5 Inter,system-ui,sans-serif;color:#b7c6d2}
.fc.tac .sc-read .tx-sec b{font:600 20px/1.15 var(--head);letter-spacing:.02em;text-transform:none;color:#fff;margin-top:2px}
.fc.tac .sc-read-k{color:var(--gold)!important}
.fc.tac .sc-read-s{font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:4px}
.fc.tac .sc-data{margin:12px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fc.tac .sc-data div{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid #12263a}
.fc.tac .sc-data div:last-child{border-bottom:0}
.fc.tac .sc-data span{font:500 8px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.fc.tac .sc-data b{font:500 12px var(--mono);color:#fff;font-variant-numeric:tabular-nums}
.fc.tac .sc-data b.hot{color:var(--gold)}.fc.tac .sc-data b.ok{color:var(--ok)}
.fc.tac .sc-read-pic{margin:12px 0 10px;height:118px;border:1px solid var(--line);background:#070b12;box-shadow:0 0 0 3px #04060b,0 0 0 4px var(--line)}
.fc.tac .sc-read-p{min-height:0}
.fc.tac .sc-read-a{margin-top:12px;gap:6px}
.fc.tac .sc-read-a a{padding:0 12px;height:24px;line-height:22px;border:1px solid var(--blue);border-radius:3px;background:var(--fill);color:var(--blue);font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.fc.tac .sc-read-a a:hover{background:var(--blue);color:#04060b}
.fc.tac .tx-log{position:absolute;left:326px;right:394px;bottom:40px;font:500 10px/1.6 var(--mono);color:var(--dim)}
.fc.tac .tx-log-in{margin-top:6px;min-height:58px}
.fc.tac .tx-log-in div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc.tac .tx-log-in div:last-child{color:var(--blue)}
.fc.tac .tx-log-in div:last-child::after{content:"_";animation:owb 1s steps(2) infinite}
.fc.tac .sc-foot{left:26px;right:22px;bottom:14px;color:var(--dim)}
.fc.tac .sc-foot a{color:var(--blue)}
.fc.tac .sc-foot a:hover{color:var(--gold)}
@container site (max-width:640px){
  .fc.tac .sc{height:640px}
  .fc.tac .tx-rail{display:none}
  .fc.tac .tx-head{left:14px;right:14px;top:12px;grid-template-columns:1fr auto;gap:10px;align-items:start}
  .fc.tac .tx-head .tx-sec b{font-size:11px}
  .fc.tac .tx-head-r{grid-column:1;grid-row:2;text-align:left;padding-top:0;font-size:8px;letter-spacing:.12em}
  .fc.tac .tx-head-r span{display:inline;margin:0 10px 0 0}
  .fc.tac .sc-nav{grid-column:2;grid-row:1/3;margin:6px 0 0;gap:6px;pointer-events:auto}
  .fc.tac .sc-nav button{min-width:44px;height:40px;line-height:40px;padding:0 10px;font-size:10px}
  .fc.tac .sc-nav .tx-listbtn{display:inline-block}
  .fc.tac .tx-head{z-index:9}
  .fc.tac .tx-list{display:none;position:absolute;left:0;right:0;top:70px;bottom:0;width:auto;z-index:8;background:#04060b;padding:8px 14px 20px;overflow:auto;-webkit-overflow-scrolling:touch}
  .fc.tac .sc.list-open .tx-listbtn{background:var(--blue);color:#04060b}
  .fc.tac .sc.list-open .tx-list{display:block}
  .fc.tac .tx-cols{grid-template-columns:62px 1fr 60px 40px;padding:14px 10px 8px;font-size:8px}
  .fc.tac .tx-rows{max-height:none;border-right:0}
  .fc.tac .tx-rows button{grid-template-columns:62px 1fr 60px 40px;min-height:46px;padding:0 10px;font-size:11px;border-bottom:1px solid #12263a}
  .fc.tac .tx-rows button span{font-size:11px}
  .fc.tac .tx-bar{margin-top:18px;gap:10px}
  .fc.tac .tx-bar button{height:40px;line-height:40px;flex:1;text-align:center}
  .fc.tac .tx-bar::before{display:none}
  .fc.tac .tx-chk{height:40px;padding:0 8px;font-size:9px}
  .fc.tac .tx-chk i{width:16px;height:16px}
  .fc.tac .tx-log{display:none}
  .fc.tac .sc-read{left:14px;right:14px;top:auto;bottom:44px;width:auto;padding:0;font-size:14px}
  .fc.tac .sc-read .tx-sec b{font-size:19px}
  .fc.tac .sc-read-s{font-size:9px}
  .fc.tac .sc-data{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;border-bottom:0;margin-top:10px}
  .fc.tac .sc-data div{padding:7px 0}
  .fc.tac .sc-data div:last-child{border-bottom:1px solid #12263a}
  .fc.tac .sc-data b{font-size:13px}
  .fc.tac .sc-read-pic{float:right;width:116px;height:74px;margin:12px 0 6px 12px}
  .fc.tac .sc-read-p{margin-top:12px;line-height:1.5}
  .fc.tac .sc-read-a{margin-top:12px;gap:8px}
  .fc.tac .sc-read-a a{height:40px;line-height:38px;padding:0 18px;font-size:11px;min-width:96px;text-align:center}
  .fc.tac .sc-foot{left:14px;right:14px;bottom:0;height:44px;align-items:center;font-size:9px}
  .fc.tac .sc-foot>span:first-child{display:none}
  .fc.tac .sc-foot-r{display:flex;gap:4px;width:100%;justify-content:space-between}
  .fc.tac .sc-foot a{display:inline-block;padding:12px 6px;font-size:9px}
}
}
@container site (max-width:640px){
  .fc .sc-speed{margin-left:0}
  .fc .sc-rail{display:none}
}

</style>
</head>
<body>
<div class="o fc cc tac"><div class="sc" tabindex="0" aria-label="A tactical plot of David Allen's work. Click a contact to lock on; arrow keys move between contacts.">
<canvas class="sc-c"></canvas>
<aside class="tx-rail"><span>Navigation</span><i class="r1"></i><i class="r2"></i><em></em></aside>
<header class="tx-head"><div class="tx-sec"><small>DRA-NAV-0001</small><b>Tactical plot</b></div><div class="tx-head-r"><span class="sc-lock">Lock: none</span><span class="sc-eta">No burn</span></div><div class="sc-nav"><button type="button" data-n="list" class="tx-listbtn" aria-label="Contacts">List</button><button type="button" data-n="home">Home</button><button type="button" data-n="prev" aria-label="Previous">&lsaquo;</button><button type="button" data-n="next" aria-label="Next">&rsaquo;</button></div></header>
